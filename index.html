<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6b3a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>藥材庫存（示範版）</title>
<style>
:root{--g:#2f6b3a;--g2:#e8f1ea;--bg:#f6f7f5;--tx:#1b1f1c;--mu:#6b736d;--rd:#c0392b;--or:#d98324;--bd:#dde2dd;--ok:#1e8449}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.4 system-ui,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--tx);padding-bottom:70px}
header{background:var(--g);color:#fff;padding:12px 16px;font-weight:600;font-size:18px;position:sticky;top:0;z-index:5}
main{padding:12px;max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--bd);z-index:5}
nav button{flex:1;border:0;background:none;padding:12px 0;font-size:14px;color:var(--mu)}
nav button.on{color:var(--g);font-weight:700;border-top:3px solid var(--g);padding-top:9px}
button,input,select,textarea{font:inherit}
.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:600;white-space:nowrap;flex-shrink:0}
.btn.s{background:#fff;color:var(--g);border:1px solid var(--g)}
.btn.d{background:var(--rd)}
.btn.sm{padding:6px 10px;font-size:14px;border-radius:8px}
.btn:disabled{opacity:.5}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mu{color:var(--mu);font-size:13px}
input[type=text],input[type=search],input[type=number],input[type=date],select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:#fff}
label.mu{display:block;margin:10px 0 4px}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:99px;margin-left:4px;color:#fff;background:#888}
.t-red{background:var(--rd)}.t-or{background:var(--or)}.t-ok{background:var(--ok)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:99px;z-index:60;font-size:15px;max-width:90vw}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
h3{margin:4px 0 10px}
.dn{color:var(--rd)}.ok{color:var(--ok)}.or{color:var(--or)}
.prog{height:6px;background:var(--g2);border-radius:4px;overflow:hidden;margin:6px 0 10px}
.prog>div{height:100%;background:var(--g)}
.sug{border:1px solid var(--bd);border-radius:10px;margin-top:4px;overflow:hidden}
.sug div{padding:10px;border-bottom:1px solid var(--bd)}
.sug div:last-child{border-bottom:0}
.sugf{position:fixed;z-index:80;background:#fff;max-height:40vh;overflow:auto;box-shadow:0 4px 14px rgba(0,0,0,.18);margin:0}
/* 相機 */
#cam{position:fixed;inset:0;background:#000;z-index:40;display:flex;flex-direction:column}
#cam .ttl{color:#fff;padding:10px 14px;font-weight:600}
#cam .vw{position:relative;flex:1;overflow:hidden}
#cam video,#cam .ghost{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#cam .ghost{opacity:.4;pointer-events:none}
#cam .bar{display:flex;justify-content:space-around;align-items:center;padding:14px 10px 22px}
#cam .shut{width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:#ddd}
#cam .fr{position:absolute;width:60px;height:60px;border:2px solid #ffeb3b;border-radius:8px;display:none;pointer-events:none}
#cam .fc{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;padding:8px 12px;font-size:14px}
#cam .fc input{accent-color:#8bc34a}
#cam .zb{padding:4px 8px;font-size:13px}
#cam .cb{background:none;border:1px solid #fff;color:#fff;border-radius:10px;padding:8px 12px}
@media (orientation:landscape){#cam{flex-direction:row}#cam .ttl{position:absolute;top:0;left:0;z-index:2;background:rgba(0,0,0,.45);padding:6px 12px}
  #cam .bar{flex-direction:column;padding:10px 16px;gap:8px}#cam .shut{width:64px;height:64px}}
/* 框選 */
.ed{position:relative;touch-action:none;user-select:none}
.ed img{width:100%;display:block;border-radius:8px}
.ed canvas{position:absolute;inset:0;width:100%;height:100%}
#edw{overflow:auto;max-height:72vh;border-radius:8px}
.edz{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.edz .on{background:var(--g);color:#fff}
/* 確認表 */
.ct{width:100%;border-collapse:collapse;font-size:15px}
.ct td{padding:10px 4px;border-bottom:1px solid var(--bd)}
.ct td.n{text-align:right;white-space:nowrap}
.ct tr.red{background:#fdecea}
.ph{width:100%;border-radius:8px;display:block;margin-bottom:8px}
</style>
</head>
<body>
<header id="hd">藥材庫存（示範版）</header>
<main id="app"></main>
<nav id="nav"></nav>
<input type="file" id="pick" accept="image/*" hidden>
<script src="vendor/ort.min.js"></script>
<script>
"use strict";
/* ========== 基本工具 ========== */
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return ymd(d)};
function toast(t,ms=2200){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),ms)}
function sheet(html){const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="sheet">${html}</div>`;document.body.appendChild(m);return m}

/* ========== 設定值（規格第 9 節） ========== */
const SAFE=10, PLENTY=30, EXP_WARN_DAYS=183, SHELF_YEARS=3, KEEP_DAYS=14;

/* ========== 資料 ========== */
/* D = { items:[{id,name,unit,safe,exp}], skus:[{id,item,vendor,qty,mode,hist:[{d,q}]}],
         batches:[{id,sku,qty,exp,photo,d}], spots:[{id,name,ord,photo,regions:[...] ,conf}],
         shots:[{d,spot,photo}], counts:[{d,q:{skuId:qty}}], sess:null|{start,done:{}} , lastCount } */
const KEY="herb_inv_v2", V1KEY="herb_inv_v1";
let D=load();
function blank(){return{items:[],skus:[],batches:[],spots:[],shots:[],counts:[],recv:[],moves:[],ships:[],alias:{},sess:null,lastCount:""}}
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.items)return s}catch(e){}
  const d=blank();
  try{const v1=JSON.parse(localStorage.getItem(V1KEY));if(v1&&v1.items&&v1.items.length){importV1(d,v1);d.fromV1=v1.items.length}}catch(e){}
  return d;
}
function fix(){D.recv=D.recv||[];D.moves=D.moves||[];D.supBrand=D.supBrand||{};D.ships=D.ships||[];D.alias=D.alias||{};D.ocrFix=D.ocrFix||{};D.slipQ=D.slipQ||[];
  for(const i of D.items)if(i.loc==="冷藏庫")i.loc="樓下";
  /* 樓下暫時不追蹤數量：舊出貨單裡樓下品項的「帳不夠」不算 */
  for(const r of D.ships)for(const l of r.lines)if(!l.skip&&!l.down&&l.took<l.n&&l.fix===undefined){const k=D.skus.find(x=>x.id===l.sku);if(k&&itemOf(k).loc==="樓下")l.down=1}
  for(const r of D.recv)if(r.sup==null){r.sup=r.vendor||"";for(const l of r.lines){const k=D.skus.find(x=>x.id===l.sku);if(k&&!k.sup)k.sup=r.sup}}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){alert("儲存失敗：空間不足？請先匯出備份")}}
function importV1(d,v1){
  for(const o of v1.items){
    if(!o.name)continue;
    let it=d.items.find(i=>i.name===o.name);
    if(!it){it={id:uid(),name:o.name,unit:"包",safe:o.safe>0?o.safe:SAFE,exp:true};d.items.push(it)}
    if(d.skus.some(s=>s.item===it.id&&s.vendor===(o.brand||"")))continue;
    d.skus.push({id:uid(),item:it.id,vendor:o.brand||"",qty:o.qty||0,mode:"photo",hist:[]});
  }
  for(const n of ["小只袋","中只袋","大只袋","特大袋","加大袋","訂做袋"])
    if(!d.items.some(i=>i.name===n)){const it={id:uid(),name:n,unit:"只",safe:SAFE,exp:false};d.items.push(it);d.skus.push({id:uid(),item:it.id,vendor:"",qty:0,mode:"photo",hist:[]})}
}
/* 包＝一斤裝（或一包）；只＝包材；兩＝高貴藥材（西紅花）；盒＝阿膠這類；罐＝黃連丸這類成藥 */
const UNITS=["包","只","兩","盒","罐"];
const itemOf=s=>D.items.find(i=>i.id===s.item)||{name:"?",unit:"包",safe:SAFE};
const skuName=s=>itemOf(s).name+(s.vendor?"（"+s.vendor+"）":"");
const unitOf=s=>itemOf(s).unit||"包";
function fifo(k){const bs=D.batches.filter(b=>b.sku===k.id&&b.qty>0).sort((a,b)=>(a.exp||"9")<(b.exp||"9")?-1:(a.exp||"9")>(b.exp||"9")?1:a.d<b.d?-1:1);
  let over=bs.reduce((t,b)=>t+b.qty,0)-k.qty;for(const b of bs){if(over<=0)break;const n=Math.min(b.qty,over);b.qty-=n;over-=n}}
function snap(s){fifo(s);const d=today();s.hist=s.hist||[];const h=s.hist[s.hist.length-1];if(h&&h.d===d)h.q=s.qty;else s.hist.push({d,q:s.qty})}

/* ========== 照片（IndexedDB） ========== */
let _db;
function db(){return _db||(_db=new Promise((ok,no)=>{const r=indexedDB.open("herb_v2",1);r.onupgradeneeded=()=>r.result.createObjectStore("p");r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}))}
async function pstore(mode,fn){const d=await db();return new Promise((ok,no)=>{const t=d.transaction("p",mode);const r=fn(t.objectStore("p"));t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>no(t.error)})}
async function pput(blob){const id=uid();await pstore("readwrite",s=>s.put({b:blob,t:Date.now()},id));return id}
async function pget(id){if(!id)return null;const v=await pstore("readonly",s=>s.get(id));return v?v.b:null}
const pdel=id=>pstore("readwrite",s=>s.delete(id));
const _urls={};
async function purl(id){if(!id)return"";if(_urls[id])return _urls[id];const b=await pget(id);return b?(_urls[id]=URL.createObjectURL(b)):""}

/* ========== 影像工具 ========== */
/* 給 max 就在解碼時直接縮小：這支手機（2GB）畫超過約 1500×2000 的 canvas 會變全黑，系統相機的 3000×4000 照片不能先畫再縮 */
async function blobImg(b,max){const im=await createImageBitmap(b,{imageOrientation:"from-image"});
  if(!max||Math.max(im.width,im.height)<=max)return im;
  const w=Math.round(im.width*max/Math.max(im.width,im.height));im.close&&im.close();
  return await createImageBitmap(b,{imageOrientation:"from-image",resizeWidth:w,resizeQuality:"high"})}
/* 縮圖：每次最多縮一半、高品質平滑（一次縮太多，字會糊掉、辨識變差） */
function toCanvas(img,max,gray){
  const s=Math.min(1,max/Math.max(img.width,img.height)),W=Math.round(img.width*s),H=Math.round(img.height*s);
  let src=img,w=img.width,h=img.height;
  while(w/2>W){const c=document.createElement("canvas");c.width=Math.round(w/2);c.height=Math.round(h/2);const x=c.getContext("2d");x.imageSmoothingQuality="high";x.drawImage(src,0,0,c.width,c.height);src=c;w=c.width;h=c.height}
  const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");x.imageSmoothingQuality="high";if(gray)x.filter="grayscale(1)";x.drawImage(src,0,0,W,H);return c;
}
const cBlob=(c,q=.82)=>new Promise(r=>c.toBlob(r,"image/jpeg",q));
function gray(img,w){const c=toCanvas(img,Math.max(w,w*img.height/img.width));const W=c.width,H=c.height,px=c.getContext("2d").getImageData(0,0,W,H).data,g=new Float32Array(W*H);for(let i=0;i<W*H;i++)g[i]=.299*px[i*4]+.587*px[i*4+1]+.114*px[i*4+2];return{w:W,h:H,g}}
function gradMap(G){const{w,h,g}=G,o=new Float32Array(w*h);for(let y=0;y<h-1;y++)for(let x=0;x<w-1;x++){const i=y*w+x;o[i]=Math.abs(g[i+1]-g[i])+Math.abs(g[i+w]-g[i])}return{w,h,g:o}}

/* 對齊：找出「上次照片座標 → 這次照片座標」的縮放＋位移（邊緣圖的相關係數，先粗後細） */
function blur3(G){const{w,h,g}=G,o=new Float32Array(w*h);for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){let s=0;for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++)s+=g[(y+j)*w+x+i];o[y*w+x]=s/9}return{w,h,g:o}}
function ncc(A,B,s,tx,ty){
  /* 先算好每一欄、每一列對到 B 的哪個位置，內圈只剩查表 */
  const{w,h}=A,cx=new Int32Array(w),ry=new Int32Array(h);
  for(let x=0;x<w;x++){const bx=Math.round(((x/w-.5)*s+.5+tx)*B.w);cx[x]=bx<0||bx>=B.w?-1:bx}
  for(let y=0;y<h;y++){const by=Math.round(((y/h-.5)*s+.5+ty)*B.h);ry[y]=by<0||by>=B.h?-1:by*B.w}
  let x0=0,x1=w;while(x0<w&&cx[x0]<0)x0++;while(x1>x0&&cx[x1-1]<0)x1--;
  let sa=0,sb=0,saa=0,sbb=0,sab=0,n=0;const ag=A.g,bg=B.g;
  for(let y=0;y<h;y++){const r=ry[y];if(r<0)continue;const o=y*w;
    for(let x=x0;x<x1;x++){const a=ag[o+x],b=bg[r+cx[x]];sa+=a;sb+=b;saa+=a*a;sbb+=b*b;sab+=a*b}n+=x1-x0}
  if(n<w*h*.55)return-1;const d=Math.sqrt((saa-sa*sa/n)*(sbb-sb*sb/n));return d?(sab-sa*sb/n)/d:-1;
}
/* 由粗到細三層：64 寬找大概位置（可容許上下左右差 20%、遠近差 12%），128、192 寬再修正 */
function align(imgA,imgB){
  const map=w=>[blur3(gradMap(gray(imgA,w))),blur3(gradMap(gray(imgB,w)))];
  let [a,b]=map(64),best={s:1,tx:0,ty:0,c:ncc(a,b,1,0,0)};
  for(let s=.88;s<=1.121;s+=.02)for(let tx=-.2;tx<=.201;tx+=1/40)for(let ty=-.2;ty<=.201;ty+=1/40){const c=ncc(a,b,s,tx,ty);if(c>best.c)best={s,tx,ty,c}}
  for(const[w,st,ss,k]of[[128,1/128,.004,4],[192,1/192,.002,2]]){[a,b]=map(w);const o=best;best={...o,c:ncc(a,b,o.s,o.tx,o.ty)};
    for(let i=-3;i<=3;i++)for(let dx=-k;dx<=k;dx++)for(let dy=-k;dy<=k;dy++){const s=o.s+i*ss,tx=o.tx+dx*st,ty=o.ty+dy*st,c=ncc(a,b,s,tx,ty);if(c>best.c)best={s,tx,ty,c}}}
  return{s:best.s,tx:best.tx,ty:best.ty,good:best.c>.6};
}
const mapRect=(r,T)=>({x:(r.x-.5)*T.s+.5+T.tx,y:(r.y-.5)*T.s+.5+T.ty,w:r.w*T.s,h:r.h*T.s});

/* 堆高：框內由上往下找第一段「有袋子紋路」的地方，回傳堆高占框高的比例 */
function stackHeight(G,r){
  const x0=Math.max(1,Math.round(r.x*G.w)),x1=Math.min(G.w-2,Math.round((r.x+r.w)*G.w));
  const y0=Math.max(1,Math.round(r.y*G.h)),y1=Math.min(G.h-2,Math.round((r.y+r.h)*G.h));
  const H=y1-y0;if(H<8||x1-x0<4)return 0;
  const sc=[];
  for(let y=y0;y<y1;y++){let s=0;for(let x=x0;x<x1;x++){const i=y*G.w+x;s+=Math.abs(G.g[i+1]-G.g[i-1])+Math.abs(G.g[i+G.w]-G.g[i-G.w])}sc.push(s/(x1-x0))}
  const sm=sc.map((v,i)=>(v+(sc[i-1]??v)+(sc[i+1]??v))/3);
  const sorted=[...sm].sort((a,b)=>a-b);const thr=Math.max(6,sorted[Math.floor(sorted.length*.9)]*.4);
  const k=Math.max(2,Math.round(H*.04));
  for(let i=0;i<sm.length-k;i++){let all=true;for(let j=0;j<k;j++)if(sm[i+j]<=thr){all=false;break}if(all)return(sm.length-i)/sm.length}
  return 0;
}
const MEASURE_W=480;
/* 左右並排好幾疊（r.cols）：框切成幾段分別量，各段跟自己的基準比，再平均。
   這樣只拿走其中一疊的幾包也量得到，不用一疊畫一個框 */
const stripOf=(r,i,n)=>({x:r.x+r.w*i/n,y:r.y,w:r.w/n,h:r.h});
function setBase(G,r){r.h0=stackHeight(G,r);const n=r.cols||1;if(n>1)r.h0s=[...Array(n)].map((_,i)=>stackHeight(G,stripOf(r,i,n)));else delete r.h0s}
function ratioOf(G,r,nr){const n=r.cols||1;
  if(n>1&&r.h0s&&r.h0s.length===n){let s=0,c=0;for(let i=0;i<n;i++)if(r.h0s[i]>.03){s+=stackHeight(G,stripOf(nr,i,n))/r.h0s[i];c++}if(c)return s/c}
  return r.h0>.03?stackHeight(G,nr)/r.h0:null}

/* ========== 相機（App 內） ========== */
let pickCb=null;
$("pick").onchange=e=>{const f=e.target.files[0];e.target.value="";if(pickCb){const cb=pickCb;pickCb=null;cb(f||null)}};
function pickFile(){return new Promise(r=>{pickCb=r;$("pick").click()})}
/* 手機內建相機 App（對焦、畫質最好；拍完回到這裡） */
function sysCam(){return new Promise(r=>{const i=document.createElement("input");i.type="file";i.accept="image/*";i.capture="environment";i.onchange=()=>r(i.files[0]||null);i.click()})}
/* App 內相機。這支舊手機的網頁相機不給自動對焦（只有手動），所以給對焦滑桿＋放大倍率，並依用途（標籤／貨架）記住上次的設定。
   快門用 ImageCapture 拍靜態照（2592×1944），失敗才截預覽畫面 */
const camPref=k=>{try{return JSON.parse(localStorage.getItem("herb_cam_"+k))||{}}catch(e){return{}}};
const camSave=(k,o)=>{try{localStorage.setItem("herb_cam_"+k,JSON.stringify(o))}catch(e){}};
/* 這支手機要先全螢幕才能轉向（全螢幕要在按按鈕的當下開）；回直式＝離開全螢幕，回到 manifest 的直式 */
async function orient(land){try{
  if(!land){if(document.fullscreenElement)await document.exitFullscreen();return true}
  if(!document.fullscreenElement)await document.documentElement.requestFullscreen({navigationUI:"hide"});
  await screen.orientation.lock("landscape");return true}catch(e){return false}}
/* 速度紀錄（只留最近 30 筆，給之後找哪裡慢） */
const perf=(k,ms)=>{try{const a=JSON.parse(localStorage.herb_perf||"[]");a.push([k,Math.round(ms),new Date().toTimeString().slice(0,5)]);localStorage.herb_perf=JSON.stringify(a.slice(-30))}catch(e){}};
/* multi：連拍，每拍一張交給 multi(畫面 canvas)、相機不關，回傳的字換成標題；按「完成」才關 */
/* raw：盤點用，直接回傳畫面 canvas（.blobP 是背後壓好的 JPEG）；這支手機壓一張 JPEG 要 5–13 秒，不能卡在按快門之後 */
function camera(title,ghostUrl,kind="shelf",land=false,multi=null,raw=false){

function lev(a,b){a=[...a];b=[...b];let p=[...Array(b.length+1).keys()];

function slipFix(t,names){
  if(D.ocrFix&&D.ocrFix[t])return{name:D.ocrFix[t],sure:true,cands:[]};
  if(D.alias[t]||names.has(t))return{name:t,sure:true,cands:[]};
  const n=[...t].length,lim=Math.max(1,Math.floor(n/3)),hits=[];
  for(const k of names){const kl=[...k].length;if(Math.abs(kl-n)>lim)continue;const d=lev(t,k);if(d<=lim)hits.push([k,d])}

  const sure=hits.length&&hits[0][1]===1&&n>=3&&D.alias[hits[0][0]]&&!(hits[1]&&hits[1][1]===1);

/* 數字先存、馬上可以拍下一層；照片 JPEG 還在背後壓，壓好才換基準照（中途關掉 App，舊基準照和舊框還是一組） */
let _spotSave=Promise.resolve(),_spotBusy=0;
const spotWait=async()=>{if(_spotBusy)toast("照片還在存，等一下…",4000);await _spotSave};
async function applySpot(sp,photo,T,rows,imC){
  if(!imC)photo=await photo;
  for(const x of rows){
    const v=x.manual&&!x.set&&!x.plenty?x.led:x.val;
    const regs=x.e.regs;
    if(x.back!=null&&regs.length===1)regs[0].r.back=x.back;
    const backs=regs.reduce((s,g)=>s+(g.r.back||0),0);let front=Math.max(0,v-backs);
    const fsum=regs.reduce((s,g)=>s+(g.f??g.r.front??0),0)||regs.length;
    regs.forEach((g,i)=>{const share=i===regs.length-1?front:Math.round(front*((g.f??g.r.front??1)/fsum));front-=share;g.r.front=share});
    x.k.qty=v;snap(x.k);
  }
  sp.conf=today();D.sess.done[sp.id]=true;save();
  const G=gray(imC||await blobImg(photo),MEASURE_W);
  _spotBusy++;const job=_spotSave.then(async()=>{const pid=await pput(await photo);
    for(const r of sp.regions){if(T.good)Object.assign(r,mapRect(r,T));setBase(G,r)}
    D.shots.push({d:today(),spot:sp.id,photo:pid});sp.photo=pid;save()}).catch(e=>alert("照片存不進去："+e.message)).finally(()=>_spotBusy--);
  _spotSave=job;if(!imC)await job;
}

    <div class="mu" style="margin:8px 0">正在自動備份到手機的「下載」資料夾…</div><button class="btn" style="width:100%" id="fo">好</button>`);$("fo").onclick=()=>m.remove();

/* 只留最近兩週的盤點照片；拍攝點基準照與批次標籤照不刪 */
async function cleanup(){
  const lim=addDays(today(),-KEEP_DAYS);
  /* 出貨單紙本還在，照片留兩週就好 */
  for(const r of D.ships)if(r.d<lim)r.photos=[];
  const keep=new Set([...D.recv.flatMap(recvPhotos),...D.ships.flatMap(r=>r.photos||[]),...D.slipQ.flatMap(q=>q.ph),...D.spots.map(s=>s.photo),...D.batches.filter(b=>b.qty>0).map(b=>b.photo)].filter(Boolean));
  const old=D.shots.filter(x=>x.d<lim);D.shots=D.shots.filter(x=>x.d>=lim);
  for(const x of old)if(!keep.has(x.photo))await pdel(x.photo);
  for(const b of D.batches)if(b.qty<=0&&b.photo){await pdel(b.photo);b.photo=""}
  /* 換掉的基準照、刪掉的拍攝點留下的照片 */
  const used=new Set([...keep,...D.shots.map(x=>x.photo)]);
  for(const id of await pstore("readonly",s=>s.getAllKeys()))if(!used.has(id))await pdel(id);
  save();
}

/* 畫框的放大倍數、移動模式（移動時手指拖照片、不畫框）、捲動位置；回到同一個拍攝點時保留 */

function editor(s){
  const cv=$("edc"),img=$("edi");if(!cv)return;cv.width=img.clientWidth;cv.height=img.clientHeight;const x=cv.getContext("2d");
  const draw=tmp=>{x.clearRect(0,0,cv.width,cv.height);x.lineWidth=2;x.font="14px sans-serif";

      x.strokeStyle=r===drag?.r?"#00e5ff":"#ffeb3b";x.strokeRect(X,Y,W,H);
      if((r.cols||1)>1){x.save();x.setLineDash([5,4]);for(let i=1;i<r.cols;i++){const xx=X+W*i/r.cols;x.beginPath();x.moveTo(xx,Y);x.lineTo(xx,Y+H);x.stroke()}x.restore()}
      /* 上下邊中間的把手：拖它改高度 */
      x.fillStyle="#fff";for(const yy of[Y,Y+H]){x.fillRect(X+W/2-9,yy-4,18,8);x.strokeRect(X+W/2-9,yy-4,18,8)}
      const t=k?skuName(k):"?";x.fillStyle="rgba(0,0,0,.6)";x.fillRect(X,Y+5,x.measureText(t).width+8,18);x.fillStyle="#fff";x.fillText(t,X+4,Y+19)}
    if(tmp){x.strokeStyle="#00e5ff";x.strokeRect(tmp.x*cv.width,tmp.y*cv.height,tmp.w*cv.width,tmp.h*cv.height)}};

    for(const r of s.regions){const inX=p.x>=r.x-tx&&p.x<=r.x+r.w+tx,inY=p.y>=r.y-ty&&p.y<=r.y+r.h+ty;
      const c=[["t",inX&&Math.abs(p.y-r.y)/ty],["b",inX&&Math.abs(p.y-r.y-r.h)/ty],["l",inY&&Math.abs(p.x-r.x)/tx],["r",inY&&Math.abs(p.x-r.x-r.w)/tx]];
      for(const[e,d]of c)if(d!==false&&d<=1&&(!best||d<best.d))best={r,e,d}}

    const h=edgeAt(st);drag=h?{r:h.r,e:h.e,o:{x:h.r.x,y:h.r.y,w:h.r.w,h:h.r.h},moved:false}:null;if(drag)draw()};

      else if(drag.e==="l"){const xx=Math.min(p.x,o.x+o.w-m);r.x=xx;r.w=o.x+o.w-xx}

    cur={x:Math.min(st.x,p.x),y:Math.min(st.y,p.y),w:Math.abs(p.x-st.x),h:Math.abs(p.y-st.y)};draw(cur)};
  cv.onpointerup=async e=>{if(edMove||!st)return;const p=st;st=null;
    if(drag){const d=drag;drag=null;draw();
      if(d.moved){/* 改了框 → 重新量基準照上的高度 */
        const im=await blobImg(await pget(s.photo));setBase(gray(im,MEASURE_W),d.r);im.close&&im.close();save();toast("框已調整");return}
      regionSheet(s.id,d.r.id);return}

}

      box.querySelectorAll("[data-id]").forEach(d=>d.onclick=()=>{const it=D.items.find(i=>i.id===d.dataset.id);inp.value=it.name;box.innerHTML="";onPick(it)});return}
    const hits=D.items.filter(i=>i.name.includes(q)).slice(0,8);
    box.innerHTML=`<div class="sug">${hits.map(i=>`<div data-id="${i.id}">${esc(i.name)}</div>`).join("")}${hits.some(i=>i.name===q)?"":`<div data-new="1">＋新增品項「${esc(q)}」</div>`}</div>`;
    box.querySelectorAll("[data-id]").forEach(d=>d.onclick=()=>{const it=D.items.find(i=>i.id===d.dataset.id);inp.value=it.name;box.innerHTML="";onPick(it)});
    const nw=box.querySelector("[data-new]");if(nw)nw.onclick=()=>{box.innerHTML="";onPick({id:"",name:q,unit:"包",safe:SAFE,exp:true,isNew:true})}};

/* 品項裡「沒填品牌、也還沒框到」的那組 */
const blankOf=it=>it&&!it.isNew?D.skus.find(x=>x.item===it.id&&!x.vendor&&!D.spots.some(s=>s.regions.some(r=>r.sku===x.id))):null;
/* 新框：還沒框到、帳上有數量的品項（例如紙本盤點輸入過的）直接列出來點選 */
function unframedList(){
  const used=new Set(D.spots.flatMap(s=>s.regions.map(r=>r.sku)));
  /* 最近兩週進貨的排最前面 */
  const lim=addDays(today(),-14);
  const its=D.items.map(it=>{const ks=D.skus.filter(k=>k.item===it.id&&!used.has(k.id));
      return{it,q:ks.reduce((t,k)=>t+k.qty,0),d:D.batches.filter(b=>b.qty>0&&b.d>=lim&&ks.some(k=>k.id===b.sku)).map(b=>b.d).sort().pop()||""}}).filter(x=>x.q>0)
    .sort((a,b)=>(a.d<b.d)-(a.d>b.d)||a.it.name.localeCompare(b.it.name,"zh-Hant"));
  if(!its.length)return"";
  return`<div class="mu" style="margin-top:8px">還沒框到、帳上有數量的（${its.length}），點一下就選好：</div>
    <div class="sug" style="max-height:38vh;overflow:auto">${its.map(x=>`<div data-id="${x.it.id}">${esc(x.it.name)}<span class="mu">　${x.q} ${esc(x.it.unit||"包")}${x.d?"　最近進貨":""}</span></div>`).join("")}</div>`}
function regionSheet(spotId,regId,newRect){
  const s=D.spots.find(x=>x.id===spotId);const r=regId?s.regions.find(x=>x.id===regId):null;

    <div id="rf"></div>

  const fill=()=>{
    if(!item){$("rf").innerHTML="";return}

    $("rf").innerHTML=`${item.isNew?`<label class="mu">單位</label><select id="ru">${UNITS.map(u=>`<option>${u}</option>`).join("")}</select>`:""}
      <label class="mu">品牌（沒有就留空）</label><select id="rv">${ks.map(k=>`<option value="${k.id}" ${(k0&&k0.id===k.id)||unf===k?"selected":""}>${esc(k.vendor||"（不分品牌）")}</option>`).join("")}<option value="">＋另一個品牌</option></select>
      <input type="text" id="rvn" data-sug="brand" placeholder="品牌名稱，例如 A牌" style="margin-top:6px;${ks.length?"display:none":""}">
      <label class="mu">左右並排幾疊（同一個品項排成好幾疊就選幾疊，框一個大框就好）</label><select id="rcol">${[1,2,3,4,5,6].map(n=>`<option ${(r?.cols||1)===n?"selected":""}>${n}</option>`).join("")}</select>

      <label class="mu">前排（看得到的那疊）有幾${esc(item.unit||"包")}</label><input type="number" inputmode="numeric" id="rq" value="${r?r.front:""}"><div class="mu" id="rqh"></div>
      <div id="rbw"><label class="mu">後排共有幾${esc(item.unit||"包")}</label><input type="number" inputmode="numeric" id="rb" value="${r?r.back||0:0}"></div>

      const left=k?k.qty-D.spots.flatMap(x=>x.regions).filter(x=>x.sku===k.id).reduce((t,x)=>t+x.front+(x.back||0),0):0;
      if(left>0&&($("rq").value===""||auto!=null)){auto=left;$("rq").value=Math.max(0,left-($("rr").value==="1"?0:parseInt($("rb").value,10)||0));
        $("rqh").textContent=`帳上還有 ${left} ${item.unit||"包"}沒框到，先帶進來；跟架上不一樣就改`}
      else if(auto!=null&&left<=0){auto=null;$("rq").value="";$("rqh").textContent=""}};
    $("rq").oninput=()=>{auto=null;$("rqh").textContent=""};
    $("rv").addEventListener("change",pre);$("rr").addEventListener("change",pre);$("rb").oninput=pre;pre();
  };

  if(item){$("rs").value=item.name;fill()}

  $("ro").onclick=async()=>{
    if(!item){alert("請先選品項");return}
    const front=parseInt($("rq").value,10);if(!(front>=0)){alert("請輸入前排數量");return}
    const rows=+$("rr").value,back=rows>1?Math.max(0,parseInt($("rb").value,10)||0):0;
    if(item.isNew){if(D.items.some(i=>i.name===item.name)){alert("已有這個品項");return}item={id:uid(),name:item.name,unit:$("ru").value,safe:SAFE,exp:$("ru").value!=="只"};D.items.push(item)}
    let k=$("rv").value?D.skus.find(x=>x.id===$("rv").value):null;
    if(!k){const vn=$("rvn").value.trim();k=D.skus.find(x=>x.item===item.id&&x.vendor===vn);
      /* 原本不知道品牌的那組（還沒框）就是這個品牌：補上品牌名，不另外多一組，免得同一批貨算兩次 */
      if(!k&&vn){const b=blankOf(item);if(b){b.vendor=vn;k=b}}

    k.mode=$("rm").value;
    const reg=r||{id:uid(),...newRect};reg.sku=k.id;reg.rows=rows;reg.front=front;reg.back=back;reg.cols=+$("rcol").value;
    const img=await blobImg(await pget(s.photo));setBase(gray(img,MEASURE_W),reg);
    if(!r)s.regions.push(reg);
    k.qty=D.spots.flatMap(x=>x.regions).filter(x=>x.sku===k.id).reduce((t,x)=>t+x.front+(x.back||0),0);snap(k);
    save();m.remove();
    if(reg.h0<.03&&k.mode==="photo")toast("這個框裡看不出堆高，盤點時可能估不出來",3500);
    if(itemOf(k).exp&&!D.batches.some(b=>b.sku===k.id))labelSheet(k,()=>openSpot(spotId));else openSpot(spotId);
  };
}

/* 標籤 → 第一批（有效日期） */
function labelSheet(k,after,batch,noCam,same){
  /* 已經有一批沒填日期的就補在那批上，不另外多開一批（不然包數會重複算） */
  batch=batch||D.batches.find(b=>b.sku===k.id&&b.qty>0&&!b.exp);
  /* 進貨：同品牌上一批有日期，先問是不是一樣（一樣就不用拍），相機不自動開 */
  const prev=same&&!(batch&&batch.exp)?D.batches.filter(b=>b.sku===k.id&&b!==batch&&b.exp).sort((a,b)=>(a.d||"")<(b.d||"")?-1:(a.d||"")>(b.d||"")?1:0).pop():null;
  if(prev)noCam=true;
  ocrEngine().catch(()=>{});
  const m=sheet(`<h3>${esc(skuName(k))}：拍標籤</h3><div class="mu">拍「下一包要用的那包」（前排、最上面）的標籤，靠近、讓標籤佔滿畫面、避開反光。${batch?`這一批 ${batch.qty} ${esc(unitOf(k))}。`:`現有 ${k.qty} ${esc(unitOf(k))}都算這一批。`}</div>
    ${prev?`<button class="btn" id="lsm" style="width:100%;margin-top:10px">跟上一批一樣：有效 ${prev.exp}</button><div class="mu" style="margin-top:4px">不一樣就按下面「拍標籤」或自己打日期。</div>`:""}
    <div id="lp" style="margin-top:8px"></div>
    <label class="mu">有效日期（照標籤上的數字打，民國年也可以）</label><input type="hidden" id="le">
    <div class="row"><input type="number" inputmode="numeric" id="ly" placeholder="29" style="flex:5;min-width:0;width:auto;font-size:18px"><span style="flex:none">年</span><input type="number" inputmode="numeric" id="lmo" placeholder="5" style="flex:3;min-width:0;width:auto;font-size:18px"><span style="flex:none">月</span><input type="number" inputmode="numeric" id="ldd" placeholder="9" style="flex:3;min-width:0;width:auto;font-size:18px"><span style="flex:none">日</span></div>
    <div class="mu" id="lsh" style="margin-top:4px"></div>
    <div class="row wrap" id="lrc" style="margin-top:6px"></div>
    <div class="row wrap" style="margin-top:6px"><span class="mu">這是製造日期：</span>${[2,3,5].map(n=>`<button class="btn s sm" data-y="${n}">＋${n} 年</button>`).join("")}</div>
    <div class="row" style="margin-top:12px"><button class="btn s grow" id="ls">先跳過</button><button class="btn s" id="lc">拍標籤</button><button class="btn grow" id="lo">儲存</button></div>`);
  /* 三格輸入 ⇄ 隱藏的 yyyy-mm-dd；年可打 2029、29 或民國 118，整串可打 290509 */
  const sync=()=>{let y=parseInt($("ly").value,10),mo=parseInt($("lmo").value,10),d=parseInt($("ldd").value,10)||1;
    if(y>=100&&y<200)y+=1911;else if(y<100)y+=2000;
    const x=new Date(y,mo-1,d),ok=y>=2000&&y<2100&&mo>=1&&mo<=12&&x.getMonth()===mo-1;
    $("le").value=ok?y+"-"+pad(mo)+"-"+pad(d):"";$("lsh").textContent=ok?`＝ ${y} 年 ${mo} 月 ${d} 日（西元）`:($("ly").value?"日期不完整或不對":"")};
  let mfg="";
  const setLE=v=>{if(!v)return;const[y,mo,d]=v.split("-");$("ly").value=+y;$("lmo").value=+mo;$("ldd").value=+d;sync()};
  $("ly").oninput=()=>{mfg="";const v=$("ly").value;
    /* 整串打在年那格也可以：20290509、1180509 */
    const m=v.match(/^(20\d\d)(\d\d)(\d\d)$/)||v.match(/^(1\d\d)(\d\d)(\d\d)$/)||v.match(/^(2[1-9]|[3-9]\d)(\d\d)(\d\d)$/);if(m){$("ly").value=+m[1];$("lmo").value=+m[2];$("ldd").value=+m[3];sync();$("ldd").blur();return}
    /* 年可以只打後兩碼（29＝2029）；打「20」還分不出是不是要打四碼，就等下一碼 */
    sync();if(v.length>=4||(v.length===3&&+v>=100&&+v<200)||(v.length===2&&v!=="20"&&v[0]!=="1"))$("lmo").focus()};
  $("lmo").oninput=()=>{mfg="";const v=$("lmo").value;sync();if(v.length===2||+v>1)$("ldd").focus()};

  if(batch&&batch.exp)setLE(batch.exp);
  $("lc").textContent=batch&&batch.photo?"重拍":"拍標籤";
  let photo=null,raw=null,gen=0,fresh=false,ocrLog=null;
  const read=async(ocr=true)=>{const my=++gen;photo=fresh?await shrinkBlob(raw,1600,.85):raw;
    $("lp").innerHTML=`<img class="ph" src="${URL.createObjectURL(photo)}"><div class="row"><div class="mu grow" id="lst">${ocr?"讀取日期中…（可以先自己填）":"之前拍的標籤"}</div><button class="btn s sm" id="lr">↻ 轉正</button></div>`;
    $("lr").onclick=async()=>{gen++;const c=rotCanvas(toCanvas(await blobImg(raw,2000),2000),90);raw=await cBlob(c,.92);fresh=true;read()};
    if(!ocr)return;const before=$("le").value;
    try{const t0=Date.now();const d=await readLabelDate(raw,()=>my===gen);if(my!==gen)return;ocrLog={d,s:Math.round((Date.now()-t0)/100)/10,e:2};if(!$("lst"))return;
      if(d&&$("le").value===before){setLE(d);$("lst").textContent="讀到日期，請確認是不是有效日期"}else if(d)$("lst").textContent=`讀到 ${d}，你已經自己填了，沒有蓋掉`;else $("lst").textContent="讀不到日期。字是歪的就按「轉正」，不然請自己填（下次靠近一點、讓標籤佔滿畫面）"}
    catch(e){if($("lst"))$("lst").textContent="讀取失敗："+e.message}};
  /* 系統相機：拍完畫面最下面右半邊＝確認、左半邊＝取消（這支手機的相機 App 圖示不會顯示） */
  const got=b=>{if(!b)return;raw=b;fresh=true;read()};
  const shoot=async()=>{got(await camera(skuName(k)+"：拍標籤",null,"label"))};
  $("lc").onclick=shoot;
  /* 製造日＋年限−1 天；連按不同年限都從同一個製造日算，改了日期才重新記 */
  m.querySelectorAll("[data-y]").forEach(b=>b.onclick=()=>{const v=mfg||$("le").value;if(!v){alert("先填日期");return}mfg=v;setLE(mfgToExp(v,+b.dataset.y));$("lsh").textContent+=`　製造 ${v}＋${b.dataset.y} 年`});
  /* 同一批貨常常同一天，最近填過的點一下就好 */
  const rc=[...new Set(D.batches.map(b=>b.exp).reverse())].filter(e=>e&&e>today()).slice(0,4);
  $("lrc").innerHTML=rc.length?`<span class="mu">最近填過：</span>`+rc.map(e=>`<button class="btn s sm" data-rc="${e}">${e}</button>`).join(""):"";
  $("lrc").querySelectorAll("[data-rc]").forEach(b=>b.onclick=()=>{mfg="";setLE(b.dataset.rc)});
  $("ls").onclick=()=>{m.remove();after&&after()};
  if(prev)$("lsm").onclick=()=>{mfg="";setLE(prev.exp);$("lo").click()};
  /* 拍了照卻沒日期就先問；存好後顯示存進去的日期，沒存到當下就看得出來 */
  $("lo").onclick=async()=>{const ev=$("le").value;
    if(!ev&&$("ly").value){alert("日期不完整或不對，請檢查年／月／日");return}
    if(!ev&&photo&&!(batch&&batch.exp)&&!confirm("還沒填有效日期，確定要存嗎？"))return;
    $("lo").disabled=true;const pid=photo&&fresh?await pput(photo):"";if(batch){batch.exp=$("le").value||batch.exp;if(pid)batch.photo=pid;if(ocrLog)batch.ocr=ocrLog}else D.batches.push({id:uid(),sku:k.id,qty:k.qty,exp:$("le").value||"",photo:pid,d:today(),ocr:ocrLog||undefined});save();m.remove();
    const se=batch?batch.exp:ev;toast(se?"已存：有效 "+se:"已存（沒有日期）",3000);after&&after()};
  if(batch&&batch.photo)pget(batch.photo).then(b=>{if(!b){if(!noCam)shoot();return}raw=b;read(!batch.exp)});else if(!noCam)shoot();
}

const recvPhotos=r=>[...(r.photos||[]),r.photo].filter(Boolean);
const supList=()=>[...new Set([...Object.keys(D.supBrand),...Object.values(D.brandSup||{}),...D.recv.map(r=>r.sup)].filter(Boolean))].sort();

const brandDL=()=>`<datalist id="brl">${brandList().map(v=>`<option value="${esc(v)}">`).join("")}</datalist>`;
/* 品牌／供應商建議清單：Android 的 datalist 只會出現在鍵盤上方那一排，所以自己做。
   欄位加 data-sug="brand" 或 "sup"，點了就在下面列出來，打字會篩選，沒有的直接打 */
const SUG={brand:()=>brandList(),sup:()=>supList()};let sugBox=null,sugFor=null;
function sugHide(){if(sugBox){sugBox.remove();sugBox=null;sugFor=null}}
function sugShow(inp){
  const q=inp.value.trim(),hits=SUG[inp.dataset.sug]().filter(v=>!q||(v.includes(q)&&v!==q));
  if(!hits.length){sugHide();return}
  if(!sugBox){sugBox=document.createElement("div");sugBox.className="sug sugf";document.body.appendChild(sugBox);
    sugBox.onpointerdown=e=>e.preventDefault();
    sugBox.onclick=e=>{const d=e.target.closest("[data-v]");if(!d||!sugFor)return;const i=sugFor;i.value=d.dataset.v;sugHide();i.dispatchEvent(new Event("input",{bubbles:true}));i.dispatchEvent(new Event("change",{bubbles:true}));sugHide()}}
  sugFor=inp;const r=inp.getBoundingClientRect();
  Object.assign(sugBox.style,{left:r.left+"px",top:r.bottom+2+"px",width:Math.max(r.width,140)+"px"});
  sugBox.innerHTML=hits.slice(0,30).map(v=>`<div data-v="${esc(v)}">${esc(v)}</div>`).join("");

document.addEventListener("focusin",e=>{if(e.target.dataset&&e.target.dataset.sug)sugShow(e.target)});
document.addEventListener("input",e=>{if(e.target===sugFor||(e.target.dataset&&e.target.dataset.sug&&document.activeElement===e.target))sugShow(e.target)});
document.addEventListener("focusout",e=>{if(e.target===sugFor)setTimeout(()=>{if(document.activeElement!==sugFor)sugHide()},200)});
document.addEventListener("scroll",()=>{if(sugFor)sugShow(sugFor)},true);

/* ========== 出貨 ========== */
/* D.ships=[{id,d,kind:"slip"|"retail"|"loss",no,cust,why,photos,lines:[{raw,q,u,n,sku,took,bt:[[批次id,扣幾包]],skip,fix,to}]}]
   fix＝補數時帳上加了多少、to＝補成幾包；有 fix 就不算帳不夠
   D.alias={單上名稱:{sku,per,u}|{skip:1}}：per＝1 斤幾包（半斤裝是 2），教過一次就記住 */
const SHIPK={slip:"出貨單",retail:"零售",loss:"損耗"};
const shipShort=l=>!l.skip&&!l.down&&l.took<l.n&&l.fix===undefined;
const shipKey=s=>s.replace(/\s/g,"").replace(/（/g,"(").replace(/）/g,")");
/* 斤、兩換算成帳上的單位；不滿一包算一包 */
const shipN=(q,u,per,unit)=>u==="個"?q:unit==="兩"?(u==="兩"?q:q*16):Math.ceil((u==="兩"?q/16:q)*per-1e-9);
/* 按顆賣、按盒入帳的（特羅漢果一盒 6 顆，k.pc）：顆數換成盒；剛好整桶（k.bulk 的倍數）是桶裝出貨，桶裝沒入帳，不扣 */
const shipNk=(q,u,per,k)=>k&&k.pc&&u==="個"?(k.bulk&&q%k.bulk===0?0:Math.ceil(q/k.pc-1e-9)):shipN(q,u,per,k?unitOf(k):"包");
/* 教過的名稱；運費、「名稱(數字)」的罐裝品不追蹤 */
function shipAuto(raw){const a=D.alias[raw];
  if(a&&a.skip)return{skip:1};
  if(a&&D.skus.some(k=>k.id===a.sku))return{sku:a.sku,per:a.per,u:a.u};
  return/^運費|\(\d+\w*\)$/.test(raw)?{skip:1}:null}
/* 第一次看到的名稱：把片、粉、規格、品牌字拿掉後找相近的給人選，不自動決定 */
function shipCands(raw){const half=/^\d+\/\d+/.test(raw),c=raw.replace(/^\d+\/\d+|^\(.\)/,"").replace(/[片粉]$/,"");
  const score=k=>{const n=itemOf(k).name;let s=[...new Set(c)].filter(x=>n.includes(x)).length/Math.max(c.length,n.length,1);
    if(half&&n.includes("半斤"))s+=.5;if(k.vendor)s+=raw.includes(k.vendor)?.3:raw[0]===k.vendor[0]?.1:0;return s};
  return D.skus.map(k=>[k,score(k)]).filter(x=>x[1]>=.5).sort((a,b)=>b[1]-a[1]).slice(0,6).map(x=>x[0])}
const shipPer=(raw,k)=>/^\d+\/\d+|半斤/.test(raw+itemOf(k).name)?2:1;
const shipU=k=>{const u=unitOf(k);return u==="只"||u==="罐"?"個":u==="兩"?"兩":"斤"};

    $("sno").oninput=()=>{const no=$("sno").value.trim(),x=no&&D.ships.find(r=>r.no===no);$("sdup").textContent=x?`這個單號 ${x.d} 記過了（${x.lines.length} 行）；存檔會併進去。`:""};
    $("sp").onclick=async()=>{const b=await camera(`出貨單（第 ${photos.length+1} 張）`,null,"slip");if(!b)return;const ph=await shrinkBlob(b,1600,.8);photos.push(ph);
      const im=document.createElement("img");im.src=URL.createObjectURL(ph);im.style.cssText="width:64px;height:64px;object-fit:cover;border-radius:6px";
      im.onclick=()=>photoView(im.src,()=>{photos.splice(photos.indexOf(ph),1);im.remove();$("sps").textContent=photos.length?`已拍 ${photos.length} 張`:""});
      $("spt").appendChild(im);$("sps").textContent=`已拍 ${photos.length} 張，讀單中…（第一次要等比較久）`;
      /* 讀出來的行接在後面；原本空著的行拿掉。多頁的單拍第二張就接著加 */
      let r=null;try{r=await readSlip(ph,()=>document.body.contains(m))}catch(e){}
      if(!document.body.contains(m))return;
      if(!r){$("sps").textContent=`已拍 ${photos.length} 張，讀不出來，請手動填（點縮圖可刪）`;return}
      if(r.no&&!$("sno").value){$("sno").value=r.no;$("sno").oninput()}
      if(r.cust&&!$("scu").value)$("scu").value=r.cust;
      if(r.rows.length)for(const L of lines.slice())if(!$("sn"+L.i).value.trim()&&!$("sq"+L.i).value){lines.splice(lines.indexOf(L),1);L.el.remove()}
      for(const x of r.rows)add(x);
      const bad=r.rows.filter(x=>!x.sure||!x.q).length;
      $("sps").textContent=`已拍 ${photos.length} 張，讀到 ${r.rows.length} 行`+(bad?`，黃色 ${bad} 行請看一下`:"，請掃一眼再存檔")}
    if(q){if(q.r.no){$("sno").value=q.r.no;$("sno").oninput()}if(q.r.cust)$("scu").value=q.r.cust;
      $("sd").value=new Date(q.t-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
      $("sps").textContent=q.st==="fail"?"讀不出來，請照照片手動填":(n=>n?`黃色 ${n} 行請看一下`:"請掃一眼再存檔")(q.r.rows.filter(x=>!x.sure||!x.q).length);
      for(const id of q.ph){const im=document.createElement("img");im.style.cssText="width:64px;height:64px;object-fit:cover;border-radius:6px";purl(id).then(u=>im.src=u);
        im.onclick=()=>purl(id).then(u=>photoView(u));$("spt").appendChild(im)}
      $("sqd").onclick=async()=>{if(!confirm("刪掉這張待確認單和照片？"))return;D.slipQ.splice(D.slipQ.indexOf(q),1);for(const id of q.ph)await pdel(id);save();close();render()}}
  }else{kind="retail";m.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{kind=b.dataset.k;m.querySelectorAll("[data-k]").forEach(x=>x.classList.toggle("s",x!==b))})}
  const usedL=()=>lines.filter(L=>slip?L.raw:L.map);
  $("sc").onclick=()=>{if(!q&&usedL().length&&!confirm("放棄這筆？"))return;close()};
  $("so").onclick=async()=>{
    if(slip)lines.forEach(L=>{if(shipKey($("sn"+L.i).value.trim())!==L.raw)resolve(L)});
    const used=usedL();if(!used.length){alert("至少要有一行");return}
    const nm=L=>L.raw||(skuOf(L)?skuName(skuOf(L)):L.map.newName);
    const bad=used.find(L=>!L.map);if(bad){alert(`「${bad.raw}」還沒選是哪個品項`);return}
    used.forEach(calc);
    const noq=used.find(L=>!L.map.skip&&!(qtyOf(L)>0));if(noq){alert(`「${nm(noq)}」還沒填數量`);return}
    const no=slip?$("sno").value.trim():"",exist=no?D.ships.find(r=>r.no===no):null;
    if(slip&&!no&&!confirm("沒填單號，之後就查不出有沒有重複記。繼續？"))return;
    if(exist&&!confirm(`單號 ${no} ${exist.d} 記過了（${exist.lines.length} 行）。多頁的單才要併進去；同一張重複記會扣兩次。\n確定併進去？`))return;
    $("so").disabled=true;
    const r=exist||{id:uid(),d:$("sd").value||today(),kind,no,cust:slip?$("scu").value.trim():"",why:slip?"":$("swhy").value.trim(),photos:[],lines:[]};
    for(const ph of photos)r.photos.push(await pput(ph));
    if(q){r.photos.push(...q.ph);const i=D.slipQ.indexOf(q);if(i>=0)D.slipQ.splice(i,1)}
    /* 記住讀錯的字：下次讀到一樣的就直接改對 */
    for(const L of used)if(L.ocr&&L.raw&&L.ocr!==L.raw)D.ocrFix[L.ocr]=L.raw;
    for(const L of used){
      if(L.map.skip){if(slip)D.alias[L.raw]={skip:1};r.lines.push({raw:L.raw,q:qtyOf(L)||0,u:L.u,skip:1});continue}
      let k=skuOf(L);
      if(!k){let it=D.items.find(i=>i.name===L.map.newName);if(!it){it={id:uid(),name:L.map.newName,unit:"包",safe:SAFE,exp:true};D.items.push(it)}
        k=D.skus.find(x=>x.item===it.id);if(!k){k={id:uid(),item:it.id,vendor:"",qty:0,mode:"photo",hist:[]};D.skus.push(k)}}
      if(slip)D.alias[L.raw]={sku:k.id,per:L.per,u:L.u};
      if(itemOf(k).loc==="樓下"){r.lines.push({raw:L.raw,q:qtyOf(L),u:L.u,n:shipNk(qtyOf(L),L.u,L.per,k),sku:k.id,took:0,down:1,bt:[]});continue}
      const N=shipNk(qtyOf(L),L.u,L.per,k),before=D.batches.filter(b=>b.sku===k.id).map(b=>[b,b.qty]),took=Math.min(N,k.qty);
      k.qty-=took;snap(k);
      r.lines.push({raw:L.raw,q:qtyOf(L),u:L.u,n:N,sku:k.id,took,bt:before.filter(([b,q])=>b.qty<q).map(([b,q])=>[b.id,q-b.qty])});
    }
    if(!exist)D.ships.push(r);save();close();render();
    toast(`已記錄 ${used.length} 行`);
    shipAsk(r);
  };
}
/* 帳不夠扣時問架上實際剩幾包，填了就校正帳；留空的維持扣到 0、繼續標帳不夠。later＝事後從單子補填 */
function shipAsk(r,later,done){
  const ks=[...new Set(r.lines.filter(shipShort).map(l=>l.sku))].map(id=>D.skus.find(k=>k.id===id)).filter(Boolean);
  if(!ks.length){if(done)done();return}
  const m=sheet(`<h3>${later?"現在架上還剩幾包？":"帳上不夠，出完這張單架上還剩幾包？"}</h3><div class="mu">不確定的留空，之後可以從這張單補填。</div>
    ${ks.map((k,i)=>{const ls=r.lines.filter(l=>!l.skip&&l.sku===k.id);return`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--bd)"><div class="grow">${esc(skuName(k))}<div class="mu">要扣 ${ls.reduce((t,l)=>t+l.n,0)}，帳上 ${ls.reduce((t,l)=>t+l.took,0)}${later?`，目前帳上 ${k.qty}`:""}</div></div><input type="number" inputmode="decimal" id="sa${i}" placeholder="${esc(unitOf(k))}" style="width:76px;flex:none"></div>`}).join("")}
    <div class="row" style="margin-top:12px"><button class="btn s grow" id="sal">之後再查</button><button class="btn grow" id="sao">存檔</button></div>`);
  $("sal").onclick=()=>{m.remove();if(done)done()};
  $("sao").onclick=()=>{
    const vals=ks.map((k,i)=>$("sa"+i).value.trim());
    if(vals.some(v=>v!==""&&!(parseFloat(v)>=0))){alert("數量要是 0 以上的數字");return}
    ks.forEach((k,i)=>{if(vals[i]==="")return;const to=parseFloat(vals[i]);
      r.lines.filter(l=>l.sku===k.id&&shipShort(l)).forEach((l,j)=>{l.fix=j?0:to-k.qty;l.to=to});
      k.qty=to;snap(k)});
    save();m.remove();render();if(done)done()};
}
function shipUndo(l){const k=D.skus.find(x=>x.id===l.sku);if(!k||l.skip)return;k.qty=Math.max(0,k.qty+l.took-(l.fix||0));for(const[id,n]of l.bt||[]){const b=D.batches.find(x=>x.id===id);if(b)b.qty+=n}snap(k)}
async function shipView(id){
  const r=D.ships.find(x=>x.id===id);const urls=[];for(const p of r.photos||[])urls.push(await purl(p));
  const m=sheet(`<h3>${r.d}　${SHIPK[r.kind]}${r.no?"　"+esc(r.no):""}</h3>${r.cust||r.why?`<div class="mu">${esc(r.cust||r.why)}</div>`:""}${urls.filter(Boolean).map(u=>`<img class="ph" src="${u}">`).join("")}
    ${r.lines.map((l,i)=>{const k=D.skus.find(x=>x.id===l.sku);return`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--bd)"><div class="grow">${esc(l.raw||(k?skuName(k):"?"))}<div class="mu">${l.skip?"不追蹤":`${l.raw?"→ "+esc(k?skuName(k):"?")+"　":""}${l.raw?l.q+l.u+"，":""}${l.down?"樓下，不扣帳":"扣 "+l.took}`}</div>${shipShort(l)?`<div class="dn">要扣 ${l.n}，帳上只有 ${l.took}</div>`:l.fix!==undefined?`<div class="mu">要扣 ${l.n}，帳上只有 ${l.took}；補數後剩 ${l.to}</div>`:""}</div><button class="btn s sm" data-x="${i}">✕</button></div>`}).join("")}
    ${r.lines.some(shipShort)?`<button class="btn" id="svf" style="width:100%;margin-top:12px">補數</button>`:""}
    <div class="row" style="margin-top:12px"><button class="btn d" id="svd">整筆刪除（還原）</button><button class="btn grow" id="svc">關閉</button></div>`);
  $("svc").onclick=()=>m.remove();m.querySelectorAll("img.ph").forEach(i=>i.onclick=()=>photoView(i.src));
  if($("svf"))$("svf").onclick=()=>{m.remove();shipAsk(r,true,()=>shipView(id))};
  m.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{if(!confirm("刪掉這行，數量加回去？"))return;const l=r.lines[+b.dataset.x];shipUndo(l);r.lines.splice(+b.dataset.x,1);
    if(!r.lines.length)D.ships=D.ships.filter(x=>x!==r);save();m.remove();render();if(r.lines.length)shipView(id)});
  $("svd").onclick=()=>{if(!confirm("整筆刪除，數量加回去？"))return;r.lines.forEach(shipUndo);D.ships=D.ships.filter(x=>x!==r);save();m.remove();render()};
}
function aliasSheet(){

/* ========== 退換貨 ========== */
/* cust 客人退回（完整的才加回，算回最舊那批）、back 退回供應商（扣庫存）、swap 供應商換貨（數量不變、換有效日期） */
const MOVE={cust:"客人退回",back:"退回供應商",swap:"換貨"};
const batchesOf=k=>D.batches.filter(b=>b.sku===k.id).sort((a,b)=>(a.exp||"9")<(b.exp||"9")?-1:(a.exp||"9")>(b.exp||"9")?1:a.d<b.d?-1:1);
function moveSheet(){
  let item=null,type="cust";
  const m=sheet(`<h3>退換貨</h3>
    <div class="row wrap">${Object.entries(MOVE).map(([k,v])=>`<button class="btn sm ${k==="cust"?"":"s"}" data-t="${k}">${v}</button>`).join("")}</div>
    <div class="mu" id="mth" style="margin:6px 0"></div>
    ${itemSearchHtml("ms")}<div id="mf"></div>
    <div class="row" style="margin-top:12px"><button class="btn s grow" id="mc">取消</button><button class="btn grow" id="mo">存檔</button></div>`);
  const hint={cust:"完整、可以再賣的才記；拆過的算損耗，不用記。會加回最舊的那一批。",back:"品質不好、即期品退回去。會從庫存扣掉。",swap:"數量不變，存檔後拍新標籤、換成新的有效日期。"};
  const fill=()=>{$("mth").textContent=hint[type];if(!item){$("mf").innerHTML="";return}
    const ks=D.skus.filter(k=>k.item===item.id);
    $("mf").innerHTML=`<label class="mu">品牌</label><select id="mk">${ks.map(k=>`<option value="${k.id}">${esc(k.vendor||"（不分品牌）")}（現有 ${k.qty}）</option>`).join("")}</select>
      ${type==="cust"?"":`<label class="mu">哪一批</label><select id="mb"></select>`}
      <label class="mu">${type==="swap"?"換幾包":"幾包"}</label><input type="number" inputmode="numeric" id="mn">
      <label class="mu">原因（可不填）</label><input type="text" id="mw" placeholder="${type==="cust"?"例如 客人買錯":"例如 發霉、快過期"}">`;
    const fb=()=>{if(!$("mb"))return;const k=D.skus.find(x=>x.id===$("mk").value);const bs=batchesOf(k).filter(b=>b.qty>0);
      $("mb").innerHTML=bs.map(b=>`<option value="${b.id}">${b.exp?"有效 "+b.exp:"未填效期"}（${b.qty} 包，${b.d} 進）</option>`).join("")||`<option value="">（沒有批次紀錄）</option>`};
    $("mk").onchange=fb;fb()};
  m.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{type=b.dataset.t;m.querySelectorAll("[data-t]").forEach(x=>x.classList.toggle("s",x!==b));fill()});
  bindItemSearch("ms",it=>{if(it.isNew){alert("找不到這個品項");return}item=it;fill()});
  fill();
  $("mc").onclick=()=>m.remove();
  $("mo").onclick=()=>{
    if(!item){alert("請先選品項");return}
    const k=D.skus.find(x=>x.id===$("mk").value),n=parseInt($("mn").value,10);if(!(n>0)){alert("請輸入包數");return}
    let b=$("mb")&&$("mb").value?D.batches.find(x=>x.id===$("mb").value):null;
    if(type!=="cust"&&n>k.qty&&!confirm(`現有只有 ${k.qty} 包，確定？`))return;
    const x={id:uid(),d:today(),type,sku:k.id,n,why:$("mw").value.trim()};
    if(type==="cust"){b=batchesOf(k)[0];if(!b){b={id:uid(),sku:k.id,qty:0,exp:"",photo:"",d:today()};D.batches.push(b)}b.qty+=n;k.qty+=n;x.batch=b.id;snap(k)}
    else if(type==="back"){if(b){const t=Math.min(n,b.qty);b.qty-=t;x.bn=t;x.batch=b.id}k.qty=Math.max(0,k.qty-n);snap(k)}
    else{/* 換貨：整批都換就直接改那批的日期；只換一部分就拆一批新的出來 */
      if(b&&n<b.qty){b.qty-=n;const nb={id:uid(),sku:k.id,qty:n,exp:b.exp,photo:"",d:today()};D.batches.push(nb);x.from=b.id;b=nb}
      else if(!b){b={id:uid(),sku:k.id,qty:Math.min(n,k.qty),exp:"",photo:"",d:today()};D.batches.push(b)}
      x.batch=b.id;x.oldExp=b.exp}
    D.moves.push(x);save();m.remove();render();toast("已記錄："+MOVE[type]);
    if(type==="swap")labelSheet(k,render,b);
  };
}
function moveView(id){
  const x=D.moves.find(y=>y.id===id),k=D.skus.find(y=>y.id===x.sku),b=D.batches.find(y=>y.id===x.batch);

    ${x.type==="swap"?`<div class="mu">有效日期：${x.oldExp||"未填"} → ${b?.exp||"未填"}</div>`:""}
    <div class="row" style="margin-top:12px"><button class="btn d" id="xd">刪除（還原）</button>${x.type==="swap"&&k&&b?'<button class="btn s" id="xl">拍新標籤</button>':""}<button class="btn grow" id="xc">關閉</button></div>`);

    D.moves=D.moves.filter(y=>y!==x);save();m.remove();render()};
}

/* ========== 長輩版 ==========
   把每個品牌的數量送到 Google 試算表（Apps Script 收件口，程式在 elder/），長輩用網頁看。
   D.elder={url,key,sent,pend}；送不出去就留 pend，下次開 app 或連上網自動補送 */
function elderUse(k){const c=D.counts;if(c.length<2)return"";const a=c[c.length-2],b=c[c.length-1];
  if(a.q[k.id]==null||b.q[k.id]==null)return"";
  const got=D.recv.filter(r=>r.d>a.d&&r.d<=b.d).flatMap(r=>r.lines).filter(l=>l.sku===k.id).reduce((s,l)=>s+l.n,0);
  const u=a.q[k.id]-b.q[k.id]+got;return u<0?"":u}
/* 到期日欄：「2026-03-02 5包、沒記 16包」；批次加起來比現有少的差額算「沒記」 */
function elderExp(k){
  if(!itemOf(k).exp)return"";/* 不追蹤有效日期的（明礬、包裝袋…）不算沒記 */
  const bs=D.batches.filter(b=>b.sku===k.id&&b.qty>0).sort((a,b)=>(a.exp||"9")<(b.exp||"9")?-1:1);
  const out=bs.filter(b=>b.exp).map(b=>b.exp+" "+b.qty+"包");
  const none=bs.filter(b=>!b.exp).reduce((s,b)=>s+b.qty,0)+Math.max(0,k.qty-bs.reduce((s,b)=>s+b.qty,0));
  if(none)out.push("沒記 "+none+"包");
  return out.join("、");
}
function elderRows(){
  const pos=new Map();for(const s of spotsSorted())for(const r of s.regions)if(!pos.has(r.sku))pos.set(r.sku,[pos.size,s.name]);
  const hide=D.elder.hide||[];/* 不給長輩看的品項（例如包裝袋） */
  const ks=D.skus.filter(k=>itemOf(k)&&!hide.includes(k.item)&&(k.qty>0||pos.has(k.id)));
  const at=k=>pos.has(k.id)?pos.get(k.id)[0]:1e9;
  ks.sort((a,b)=>at(a)-at(b)||itemOf(a).name.localeCompare(itemOf(b).name,"zh-Hant"));
  return ks.map(k=>[pos.has(k.id)?pos.get(k.id)[1]:"",itemOf(k).name,k.vendor,k.qty,lowSku(k)?1:0,
    elderExp(k),
    supOf(k),elderUse(k)]);
}

    const n=new Date();e.pend=false;e.sent=today()+" "+pad(n.getHours())+":"+pad(n.getMinutes());save();if(!quiet)toast("長輩版已更新")}

}

      const L=[0,1,2,3,4].map(j=>{const k=ks[s*5+j];return{x:.03+j*.194,w:.17,n:demoRnd(2,12),name:itemOf(k).name,sku:k.id}});
      const c=demoShelf(L),pid=await pput(await cBlob(c,.85)),G=gray(c,MEASURE_W);
      const regions=L.map(l=>{const r={id:uid(),x:l.x,y:.12,w:l.w,h:.78,sku:l.sku,rows:1,front:l.n,back:0,cols:1};setBase(G,r);return r});
      for(const l of L){const k=ks.find(x=>x.id===l.sku);k.qty=l.n}
      D.spots.push({id:uid(),name:"貨架 "+"AB"[s>>1]+"-"+(s%2+1),ord:s+1,photo:pid,regions,conf:addDays(t,-7),land:false,demo:L});
      await new Promise(r=>setTimeout(r,10))}
    for(const k of ks.slice(20))k.qty=demoRnd(4,15);
    /* 歷史：過去三週每週少一點，看得出用量；幾批快到期 */
    for(const k of ks){k.hist=[3,2,1].map(w=>({d:addDays(t,-7*w),q:k.qty+w*demoRnd(0,2)}));
      D.batches.push({id:uid(),sku:k.id,qty:k.qty,exp:addDays(t,demoRnd(1,10)<3?demoRnd(20,150):demoRnd(300,1000)),photo:"",d:addDays(t,-30)})}
    D.counts=[3,2,1].map(w=>({d:addDays(t,-7*w),q:Object.fromEntries(ks.map(k=>[k.id,k.hist[3-w].q]))}));D.lastCount=addDays(t,-7);
    /* 出貨單上的寫法：教過三個，其他第一次會問 */
    for(const k of ks.slice(0,3))D.alias[itemOf(k).name]={sku:k.id,per:1,u:"斤"};
    D.recv.push({id:uid(),d:addDays(t,-10),sup:"甲藥行",photos:[],lines:ks.slice(0,2).map(k=>({sku:k.id,n:6,batch:D.batches.find(b=>b.sku===k.id).id}))});
    D.demoV=1;save();render();toast("示範資料建好了");
  }catch(e){alert("建立示範資料失敗："+e.message)}finally{m.remove()}}
async function demoReset(){if(!confirm("清掉目前的資料，重新建立示範資料？"))return;await pstore("readwrite",s=>s.clear());await demoSeed()}

/* ========== 啟動 ========== */
fix();save();render();
if(DEMO&&!D.items.length)setTimeout(demoSeed,300);
if(D.slipQ.some(q=>q.st==="wait"))setTimeout(slipWork,3000);
setTimeout(cloudSend,8000);setInterval(cloudSend,36e5);addEventListener("online",()=>setTimeout(cloudSend,5000));
try{screen.orientation.lock("portrait").catch(()=>{})}catch(e){}
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js");
  /* 新版 sw 接手後才有多執行緒要的標頭；App 閒著就重開一次，正在操作就等下次打開 */
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!crossOriginIsolated&&!document.querySelector(".modal,.sheet,.ov,#cam"))location.reload()})}
</script>
